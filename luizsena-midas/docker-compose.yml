version: "3.7"

services:
  app_proxy:
    environment:
      # <app-id>_<serviço>_1
      APP_HOST: luizsena-midas_web_1
      APP_PORT: 3847
      # Login do umbrel continua ligado (padrão). O Midas tem login próprio por cima.

  web:
    # Gerado pelo workflow .github/workflows/image.yml (tag + digest multi-arch).
    image: ghcr.io/luizerz/midas:0.1.0@sha256:COLE_O_DIGEST_AQUI
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 30s
    environment:
      TZ: America/Sao_Paulo
      # Senha de login: gerada pelo umbrel (deterministicPassword) e mostrada no app.
      MIDAS_PASSWORD: ${APP_PASSWORD}
      MIDAS_SECRET: ${APP_LUIZSENA_MIDAS_SESSION_SECRET}
    volumes:
      # Banco SQLite (midas.db). Entra no backup do umbrel.
      - ${APP_DATA_DIR}/data/midas:/data
    # Endurecimento: rootfs só leitura, sem capabilities, sem escalar privilégio.
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
