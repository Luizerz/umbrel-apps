manifestVersion: 1
id: luizerz-midas
storage:
  dataRoot: data
category: finance
name: Midas
version: "0.2.1"
tagline: Gastos do cartão, aporte e o que sobra do salário
icon: https://raw.githubusercontent.com/Luizerz/umbrel-apps/main/luizerz-midas/icon.svg
description: >-
  Substitui a planilha mensal de gastos: faturas dos cartões (importadas da
  Nubank e da Rico), descontos de quem usa seus cartões, pagamentos fixos,
  aporte e quanto sobra livre no mês.


  Segurança: o Midas tem login próprio. No primeiro acesso, entre com a senha
  inicial gerada pelo umbrel (aparece nos detalhes do app) e crie a sua; a
  inicial deixa de funcionar. Por padrão o umbrel também pede o login do
  umbrel antes de abrir o Midas.


  Use só na rede local ou pela VPN. Não exponha a porta na internet.
releaseNotes: >-
  Ícone novo: a digital de ouro (o toque de Midas) no lugar da moedinha, no
  app, no favicon e no umbrel. O carregamento agora mostra a digital se
  desenhando do centro para fora.

developer: Luiz Sena
